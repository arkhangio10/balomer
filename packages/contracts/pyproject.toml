[project]
name = "balomer-contracts"
version = "0.1.0"
description = "Balomer boundary types, generated from JSON Schema"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = ["pydantic==2.14.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/balomer_contracts"]
