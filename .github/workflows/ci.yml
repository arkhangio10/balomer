name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.17"
          python-version: "3.12"
          enable-cache: true

      - name: Install workspace
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy services packages infra

      - name: Test
        run: uv run pytest

      - name: Check generated contracts are fresh
        run: |
          make contracts
          git diff --exit-code -- packages/contracts/src apps/tv/src
          test -z "$(git status --porcelain -- packages/contracts/src apps/tv/src)"

  tv:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tv
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/tv/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test -- --ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint
