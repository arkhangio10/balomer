[project]
name = "balomer-api"
version = "0.1.0"
description = "Balomer API service (FastAPI)"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "fastapi==0.159.1",
    "uvicorn==0.54.0",
    "websockets==17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/balomer_api"]
